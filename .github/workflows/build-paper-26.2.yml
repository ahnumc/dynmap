name: Build Paper 26.2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Paper 26.2 JAR
        run: ./gradlew :spigot:shadowJar --build-cache

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: dynmap-paper-26.2
          path: target/Dynmap-*-spigot.jar
          if-no-files-found: error
          archive: false
